apiVersion: v1
kind: Namespace
metadata:
  name: kars-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-workspace-mcp
  namespace: kars-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-workspace-mcp
  template:
    metadata:
      labels:
        app: forge-workspace-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: forge-workspace-mcp:dev
          imagePullPolicy: Never
          ports:
            - name: mcp
              containerPort: 8931
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forge-workspace-mcp
  namespace: kars-mcp
spec:
  selector:
    app: forge-workspace-mcp
  ports:
    - name: mcp
      port: 8931
      targetPort: mcp
---
apiVersion: kars.azure.com/v1alpha1
kind: McpServer
metadata:
  name: forge-workspace
  namespace: kars-system
  labels:
    kars.azure.com/sandbox: forge
spec:
  url: http://forge-workspace-mcp.kars-mcp.svc.cluster.local:8931/mcp
  productionMode: false
  displayName: Forge bounded workspace
  allowedTools:
    - workspace_get_task
    - workspace_read_file
    - workspace_search
    - workspace_apply_patch
    - workspace_run_test
    - workspace_get_diff
    - workspace_reset
  allowedSandboxes:
    matchLabels:
      kars.azure.com/sandbox: forge
